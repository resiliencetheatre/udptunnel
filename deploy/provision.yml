---
# Included after sudo and OTP-state checks, before bundle staging.
- name: Inspect installed wstunnel
  ansible.builtin.stat:
    path: /usr/local/bin/wstunnel
    follow: true
  register: installed_wstunnel

- name: Require a self-compiled wstunnel installation
  ansible.builtin.assert:
    that:
      - installed_wstunnel.stat.isreg | default(false)
      - installed_wstunnel.stat.executable | default(false)
    fail_msg: >-
      Build and install wstunnel at /usr/local/bin/wstunnel on every mesh host
      before deployment. Ansible does not download or install wstunnel.

- name: Gather operating system facts
  ansible.builtin.setup:
    gather_subset: [min]

- name: Require a supported provisioning platform
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: Automatic provisioning currently supports Debian/Ubuntu with systemd.

- name: Install transport prerequisites
  ansible.builtin.apt:
    name: [wireguard-tools, iproute2, systemd]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether networkd is packaged separately
  ansible.builtin.command: apt-cache show systemd-networkd
  register: networkd_package
  changed_when: false
  failed_when: networkd_package.rc not in [0, 100]

- name: Install separate networkd package when available
  ansible.builtin.apt:
    name: systemd-networkd
    state: present
  when: networkd_package.rc == 0

- name: Ensure executable installation directory exists
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Inspect endpoint executable
  ansible.builtin.stat:
    path: /usr/local/bin/utun-node
  register: endpoint_executable
  when: inventory_hostname in groups['peers']

- name: Build missing endpoint executable natively
  when:
    - inventory_hostname in groups['peers']
    - not (endpoint_executable.stat.executable | default(false))
  block:
    - name: Install native build dependencies
      ansible.builtin.apt:
        name: [build-essential, libssl-dev]
        state: present

    - name: Create unprivileged build workspace
      become: false
      ansible.builtin.tempfile:
        state: directory
        prefix: utun-build-
      register: endpoint_build

    - name: Copy only build inputs from controller
      become: false
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ endpoint_build.path }}/{{ item }}"
        mode: preserve
        directory_mode: '0700'
      loop:
        - Makefile
        - node.c
        - mesh.c
        - socket.c
        - tun.c
        - log.c
        - log.h
        - ini.c
        - ini.h
        - include/

    - name: Compile endpoint on its own host
      become: false
      ansible.builtin.command:
        argv: [make, utun-node]
        chdir: "{{ endpoint_build.path }}"
      changed_when: true

    - name: Install native endpoint executable
      ansible.builtin.copy:
        src: "{{ endpoint_build.path }}/utun-node"
        dest: /usr/local/bin/utun-node
        remote_src: true
        owner: root
        group: root
        mode: '0755'
  always:
    - name: Remove endpoint build workspace
      become: false
      ansible.builtin.file:
        path: "{{ endpoint_build.path }}"
        state: absent
      when: endpoint_build is defined and endpoint_build.path is defined
